<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Free-Flight Airplane</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="info">
    Use arrow keys: ↑ pitch down, ↓ pitch up, ← roll left, → roll right
  </div>

  <!-- 최신 Three.js (ES Module 방식) -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js';
    
    // 이제 기존 script.js의 코드를 이 안에 그대로 넣으면 됩니다.
    import { initGame } from './script.js';
    initGame(THREE, OrbitControls);
  </script>
</body>
</html>
